<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Login - Amos Garden">
  <title>Admin Login - Amos Garden</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .admin-login-page {
      background-color: var(--bs-secondary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-box {
      background: #fff;
      border-radius: var(--bs-border-radius-lg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 440px;
      padding: 3rem;
      text-align: center;
    }

    .login-box h2 {
      color: var(--bs-secondary);
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
    }

    .login-box .lead {
      color: #666;
      margin-bottom: 2rem;
    }

    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }

    .form-control {
      width: 100%;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: var(--bs-border-radius-sm);
      font-size: 1rem;
      transition: var(--bs-transition);
    }

    .form-control:focus {
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 0.25rem rgba(82, 183, 136, 0.15);
    }

    .error {
      color: #e63946;
      background: #fde8e9;
      padding: 1rem;
      border-radius: var(--bs-border-radius-sm);
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      text-align: left;
    }

    .btn-login {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .back-link {
      color: #666;
      text-decoration: none;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-top: 1.5rem;
    }

    .back-link:hover {
      color: var(--bs-secondary);
      text-decoration: underline;
    }
  </style>
</head>
<body class="admin-login-page">

  <div class="login-box animate-fade-in-up">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background: rgba(27, 67, 50, 0.1);">
      <i class="bi bi-shield-lock fs-1 text-secondary"></i>
    </div>

    <h2>Amos Garden Admin</h2>
    <p class="lead">Sign in to access the admin dashboard</p>





    <div id="errorContainer"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" required autocomplete="username" placeholder="Enter username">
        <div class="invalid-feedback">Please enter your username.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Enter password">
          <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Toggle password visibility">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback">Please enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary btn-login" style="background-color: var(--bs-secondary); border-color: var(--bs-secondary);">
        <i class="bi bi-box-arrow-in-right me-2"></i>Log In
      </button>
    </form>

    <a href="index.html" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to Public Shop
    </a>
  </div>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>








  <script>
    document.getElementById('togglePassword')?.addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    (function() {
      'use strict';

      const form = document.getElementById('loginForm');
      const errorContainer = document.getElementById('errorContainer');

      function showError(message) {
        errorContainer.innerHTML = `
          <div class="error">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>${message}
          </div>
        `;
      }

      function clearError() {
        errorContainer.innerHTML = '';
      }

      form.addEventListener('submit', function(event) {
        event.preventDefault();
        event.stopPropagation();
        clearError();

        if (form.checkValidity()) {
          const submitBtn = form.querySelector('button[type="submit"]');
          const originalHtml = submitBtn.innerHTML;

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status"></span>Signing in...';

          setTimeout(() => {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === 'amos' && password === 'plants123') {
              localStorage.setItem('amosGardenAdmin', JSON.stringify({
                username: 'amos',
                loggedIn: true,
                loginTime: Date.now()
              }));

              window.location.href = 'admin_dashboard.html';
            } else {
              showError('Incorrect username or password.');
              submitBtn.disabled = false;
              submitBtn.innerHTML = originalHtml;
            }
          }, 800);
        }

        form.classList.add('was-validated');
      }, false);
    })();

    document.addEventListener('DOMContentLoaded', function() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.style.animationPlayState = 'running';
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });

      document.querySelectorAll('.animate-fade-in-up').forEach(el => {
        el.style.animationPlayState = 'paused';
        observer.observe(el);
      });
    });
  </script>
</body>
</html>
