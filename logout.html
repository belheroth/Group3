<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logging Out - Amos Garden</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .logout-page {
      background-color: var(--bs-body-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .logout-card {
      background: #fff;
      border-radius: var(--bs-border-radius-lg);
      box-shadow: var(--bs-box-shadow);
      max-width: 400px;
      width: 100%;
      padding: 3rem 2rem;
      text-align: center;
    }

    .logout-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--bs-primary), var(--bs-primary-dark));
      display: flex;
      align-items: center;
      justify-content: center
      ;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      color: #fff;
    }
  </style>
</head>
<body class="logout-page">

  <div class="logout-card animate-fade-in-up">
    <div class="logout-icon">
      <i class="bi bi-box-arrow-right"></i>
    </div>

    <h2 class="fw-bold mb-2" style="color: var(--bs-secondary);">Logging Out</h2>
    <p class="text-muted mb-4">Please wait while we sign you out...</p>

    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous">




  </script>

  <script>
    localStorage.removeItem('amosGardenUser');
    localStorage.removeItem('amosGardenCart');
    localStorage.removeItem('amosGardenPrefs');
    localStorage.removeItem('amosGardenCheckoutData');
    localStorage.removeItem('amosGardenAdmin');

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
  </script>
</body>
</html>
